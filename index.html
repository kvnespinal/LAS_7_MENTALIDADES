<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07102d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Las 7 Mentalidades</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <main id="app">
        <section id="screen"></section>
    </main>

    <script src="app.js"></script>

    <script>
    (function () {
        const DESIGN_W = 1080;
        const DESIGN_H = 1920;
        const screen = document.getElementById("screen");

        function updateDesignScale() {
            if (!screen) return;

            const scale = Math.min(
                window.innerWidth / DESIGN_W,
                window.innerHeight / DESIGN_H
            );

            screen.style.setProperty("--ui-scale", String(scale));
        }

        updateDesignScale();
        window.addEventListener("resize", updateDesignScale);
        window.addEventListener("orientationchange", updateDesignScale);

        if (!("serviceWorker" in navigator)) return;

        window.addEventListener("load", async function () {
            try {
                const registration = await navigator.serviceWorker.register("./sw.js", {
                    updateViaCache: "none"
                });

                /*
                 * Startup never depends on the network.
                 * The Service Worker is cache-first for navigation.
                 */
                if (navigator.onLine) {
                    try {
                        await registration.update();
                    } catch (e) {
                        console.log("No se pudo comprobar actualización.");
                    }

                    /*
                     * Version check is only an online enhancement.
                     * It never blocks the app and never clears the cache.
                     */
                    try {
                        const response = await fetch("./version.json", {
                            cache: "no-store"
                        });

                        if (response.ok) {
                            const remote = await response.json();
                            const remoteVersion = remote.version;
                            const localVersion = localStorage.getItem("las7_version");

                            if (!localVersion) {
                                localStorage.setItem("las7_version", remoteVersion);
                            } else if (localVersion !== remoteVersion) {
                                localStorage.setItem("las7_version", remoteVersion);

                                if (registration.waiting) {
                                    registration.waiting.postMessage({
                                        type: "SKIP_WAITING"
                                    });
                                }
                            }
                        }
                    } catch (e) {
                        console.log("Sin conexión para comprobar versión.");
                    }
                }
            } catch (error) {
                console.warn("Service Worker no disponible:", error);
            }
        });

        let reloadedForUpdate = false;

        navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (reloadedForUpdate) return;
            reloadedForUpdate = true;
            window.location.reload();
        });
    })();
    </script>
</body>
</html>
