<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Las 7 Mentalidades</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <main id="app">

        <section id="screen">

            <!-- Aquí JavaScript colocará las diferentes pantallas -->

        </section>

    </main>

    <script src="app.js"></script>

<script>
    const CURRENT_VERSION = "1.0.0";

    async function checkForUpdates() {

        try {

            const response = await fetch("./version.json", {
                cache: "no-store"
            });

            if (!response.ok) return;

            const remoteData = await response.json();

            if (remoteData.version !== CURRENT_VERSION) {

                console.log(
                    "Nueva versión disponible:",
                    remoteData.version
                );

                if (navigator.serviceWorker.controller) {

                    const messageChannel = new MessageChannel();

                    messageChannel.port1.onmessage = function (event) {

                        if (
                            event.data &&
                            event.data.type === "CACHE_CLEARED"
                        ) {

                            window.location.reload();

                        }

                    };

                    navigator.serviceWorker.controller.postMessage(
                        {
                            type: "CLEAR_CACHE"
                        },
                        [messageChannel.port2]
                    );

                } else {

                    window.location.reload();

                }

            }

        } catch (error) {

            console.log(
                "No se pudo comprobar actualización. Se continúa con la versión disponible."
            );

        }

    }


    if ("serviceWorker" in navigator) {

        window.addEventListener("load", async function () {

            try {

                const registration =
                    await navigator.serviceWorker.register(
                        "./sw.js",
                        {
                            updateViaCache: "none"
                        }
                    );

                await registration.update();

                await checkForUpdates();

            } catch (error) {

                console.warn(
                    "Service Worker no disponible:",
                    error
                );

            }

        });

    }
</script>

</body>

</html>
