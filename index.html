<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07102d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Las 7 Mentalidades</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <main id="app">
        <section id="screen"></section>
    </main>

    <script src="app.js"></script>

    <script>
    (function () {
        const DESIGN_W = 1080;
        const DESIGN_H = 1920;
        const screen = document.getElementById("screen");

        function updateDesignScale() {
            if (!screen) return;

            const scale = Math.min(
                window.innerWidth / DESIGN_W,
                window.innerHeight / DESIGN_H
            );

            screen.style.setProperty("--ui-scale", String(scale));
        }

        updateDesignScale();
        window.addEventListener("resize", updateDesignScale);
        window.addEventListener("orientationchange", updateDesignScale);

        if (!("serviceWorker" in navigator)) return;

        let reloadedForUpdate = false;

        navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (reloadedForUpdate) return;
            reloadedForUpdate = true;
            window.location.reload();
        });

        window.addEventListener("load", async function () {
            try {
                const registration = await navigator.serviceWorker.register("./sw.js", {
                    scope: "./",
                    updateViaCache: "none"
                });

                // Ask the browser to check for a newer worker only when online.
                // Startup itself never waits for the network.
                if (navigator.onLine) {
                    registration.update().catch(() => {});
                }

                // Version check is informational only. It never clears the
                // current cache and never blocks the application.
                if (navigator.onLine) {
                    try {
                        const response = await fetch("./version.json", {
                            cache: "no-store"
                        });

                        if (response.ok) {
                            const remote = await response.json();
                            if (remote && remote.version) {
                                localStorage.setItem("las7_version", remote.version);
                            }
                        }
                    } catch (e) {
                        console.log("Sin conexión para comprobar versión.");
                    }
                }
            } catch (error) {
                console.warn("Service Worker no disponible:", error);
            }
        });
    })();
    </script>
</body>
</html>
